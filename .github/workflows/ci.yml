name: CI

on:
  merge_group:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          # Pin to the org's dev SDK: the 3.13 formatter reformats files the
          # 3.12 formatter accepts, so a floating SDK turns the format gate
          # red on untouched code (main red since 2026-08-12).
          sdk: 3.12.2

      - name: Resolve workspace
        run: dart pub get

      - name: Check lint extension
        run: cd packages/lint && dart pub get && dart analyze && dart format --output=none --set-exit-if-changed . && dart test

      # Runs the register lint (`decisions lint docs/decisions`, via the
      # standalone tool/ package — genesis's main workspace has no dependency
      # on the `decisions` package) so a stale force cache fails the build
      # instead of only surfacing when an agent lints a branch by hand.
      - name: decisions lint
        run: cd tool && dart pub get && dart analyze && dart format --output=none --set-exit-if-changed . && dart run lint_register.dart

      - name: Analyze
        run: dart analyze

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Test (all packages via melos)
        run: |
          dart pub global activate melos
          dart pub global run melos run test

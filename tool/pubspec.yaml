name: genesis_register_tool
description: >-
  The genesis register's CI check. Not a published package and not part of
  the main workspace — it exists only so a clean checkout can lint
  docs/decisions with the same engine `lunar decisions lint` composes,
  without genesis depending on the `decisions` package in its main workspace.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.11.0

dependencies:
  decisions:
    git:
      url: https://github.com/memento-engineering/decisions.git
      path: cli/dart/decisions
      ref: decisions-v0.2.0
  path: ^1.9.0

dev_dependencies:
  lints: ^5.1.0
